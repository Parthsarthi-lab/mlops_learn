name: CI Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
      - 'src/train_mlflow.py'
      - 'src/train.py'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Code Linting
        run: flake8 src/ app.py --max-line-length=120 --ignore=E501,W503

      - name: Run Pytest Validation Suite
        run: pytest tests/

      - name: Verify Docker Image Build
        run: docker build -t streamlit-app:test .